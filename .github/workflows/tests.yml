name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: exmachinis
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: exmachinis
      DB_USERNAME: root
      DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: imap, pdo_mysql
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Load database schema and test data
        run: |
          mysql -h 127.0.0.1 -uroot -psecret < game-engine/sql/create_db.sql
          mysql -h 127.0.0.1 -uroot -psecret exmachinis < game-engine/db-backup/exmachinis_tables.sql
          mysql -h 127.0.0.1 -uroot -psecret < tests/database/fixtures.sql

      - name: Run tests
        run: vendor/bin/phpunit

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Check the committed build is up to date
        run: |
          git status --porcelain html/build
          test -z "$(git status --porcelain html/build)" || { echo "html/build is stale: run 'npm run build' and commit the result"; exit 1; }
