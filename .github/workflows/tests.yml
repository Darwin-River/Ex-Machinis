name: Tests

on:
  push:
    branches: [main, public-forge]
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest

    services:
      mysql:
        # The same version as deploy/docker-compose.yml
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: exmachinis
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: exmachinis
      DB_USERNAME: root
      DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Load database schema, migrations and test data
        run: |
          mysql -h 127.0.0.1 -uroot -psecret < game-engine/sql/create_db.sql
          mysql -h 127.0.0.1 -uroot -psecret exmachinis < game-engine/db-backup/exmachinis_tables.sql
          DB_USER=root DB_NAME=exmachinis MYSQL_PWD=secret game-engine/sql/migrate.sh
          mysql -h 127.0.0.1 -uroot -psecret < tests/database/fixtures.sql
          TEST_DB_NAME=exmachinis_test MYSQL_PWD=secret game-engine/sql/init_test_world.sh

      - name: Run tests
        run: vendor/bin/phpunit

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Check the committed build is up to date
        run: |
          git status --porcelain html/build
          test -z "$(git status --porcelain html/build)" || { echo "html/build is stale: run 'npm run build' and commit the result"; exit 1; }

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the generated game data is up to date
        run: |
          python3 game-engine/sql/game-data/build_game_data.py
          git status --porcelain game-engine/sql/game_data.sql documents/design-manual.md
          test -z "$(git status --porcelain game-engine/sql/game_data.sql documents/design-manual.md)" || { echo "Run game-engine/sql/game-data/build_game_data.py and commit the result"; exit 1; }

      - name: Install build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libconfig-dev libmysqlclient-dev

      - name: Build game and events engines
        run: make -C game-engine/src all

      - name: Check the orbit maths against real positions
        run: make -C game-engine/src test

      - name: Check the Machine view's WebAssembly matches the engine's VM
        # The committed html/wasm/machine.wasm against a native build of
        # the same VM, step by step (touch: test it as committed)
        run: touch html/wasm/machine.wasm && make -C game-engine/machine test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build images and run the end-to-end smoke test
        run: deploy/smoke-test.sh

      - name: Logs on failure
        if: failure()
        working-directory: deploy
        run: docker compose logs --tail 200
