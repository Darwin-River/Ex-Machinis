# Ex-Machinis: the whole game on one server.
#   ./setup.sh            first time: writes .env, starts everything
#   docker compose up -d  later starts, after editing .env or pulling new code
#
# Only ports 80/443 (the website) are published. There is no email (#367).

name: exmachinis

x-engine-env: &engine-env
  DB_HOST: db
  DB_PORT: "3306"
  DB_NAME: exmachinis
  DB_USER: exmachinis
  DB_PASSWORD: ${DB_PASSWORD:?run setup.sh first}
  # Master game clock (see game-engine/conf/game-engine.conf)
  GAME_TIME_SCALE: ${GAME_TIME_SCALE:-60}
  # The clock floor (#324 step 20): the clock slows when the engines fall
  # behind, never below GAME_TIME_FLOOR ("0": it never floats); behind at the
  # floor, new releases queue
  GAME_TIME_FLOOR: ${GAME_TIME_FLOOR:-0}
  CLOCK_LAG_HIGH: ${CLOCK_LAG_HIGH:-60}
  CLOCK_LAG_LOW: ${CLOCK_LAG_LOW:-15}
  # -1: quiet logs (errors, warnings and clock changes only); 0 to 3 log
  # every step, which at full load is gigabytes a day
  APP_TRACE_LEVEL: ${ENGINE_TRACE_LEVEL:--1}
  TRAVEL_ACCELERATION: ${TRAVEL_ACCELERATION:-1}
  # No email (#367 step 5): drones' replies go to drone_messages, which the
  # website shows
  EMAIL_ENABLED: "0"

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    # Throughput (#324 step 20): no binary log (a busy world wrote gigabytes
    # an hour of it; backups use mysqldump), and the log flushed to disk
    # once a second rather than at every commit (a power cut can lose the
    # last second of play; a crash of MySQL alone loses nothing)
    command: ["--disable-log-bin", "--innodb-flush-log-at-trx-commit=2"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?run setup.sh first}
      MYSQL_DATABASE: exmachinis
      MYSQL_USER: exmachinis
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
      # The base schema, loaded only when the database volume is first
      # created. Later changes come from the migrate service.
      - ../game-engine/sql/create_db.sql:/docker-entrypoint-initdb.d/01-create_db.sql:ro
      - ../game-engine/db-backup/exmachinis_tables.sql:/docker-entrypoint-initdb.d/02-tables.sql:ro
    healthcheck:
      # Over TCP, so it only passes once the schema has been loaded.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uexmachinis -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 60

  # Runs on every start, before the website and engines: applies the schema
  # migrations the database hasn't had yet (game-engine/sql/migrations/),
  # then loads the current game data, which replaces the reference tables
  # (resources, protocols, queries...) and leaves players and drones alone.
  migrate:
    image: mysql:8.4
    restart: "no"
    depends_on:
      db: {condition: service_healthy}
    # As root: migrations may create triggers, which MySQL (with its binary
    # log on) only lets an administrator do
    environment:
      DB_HOST: db
      DB_USER: root
      DB_NAME: exmachinis
      MYSQL_PWD: ${DB_ROOT_PASSWORD}
      # The test world's database (#324 step 7), kept up to date with the
      # live one: the Release page's Test button runs scripts there
      TEST_DB_NAME: exmachinis_test
      DB_APP_USER: exmachinis
    volumes:
      - ../game-engine/sql:/sql:ro
      - ../game-engine/db-backup:/db-backup:ro
    entrypoint: ["sh", "-c", "/sql/migrate.sh && mysql -hdb -uroot exmachinis < /sql/game_data.sql && echo 'migrate: game data loaded' && /sql/init_test_world.sh"]

  app:
    build:
      context: ..
      dockerfile: deploy/app/Dockerfile
    image: exmachinis-app
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
    environment:
      APP_NAME: Ex-Machinis
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?run setup.sh first}
      APP_URL: ${APP_URL:-https://${DOMAIN}}
      LOG_CHANNEL: stderr
      TRUSTED_PROXIES: "*"
      DB_HOST: db
      DB_DATABASE: exmachinis
      DB_USERNAME: exmachinis
      DB_PASSWORD: ${DB_PASSWORD}
      CRON_KEY: ${CRON_KEY:?run setup.sh first}
      # TEST_WORLD=1 shows the Release page's Test button; start the test
      # world's engines with: docker compose --profile testworld up -d
      TEST_WORLD: ${TEST_WORLD:-0}
      # FORGE_STATION_DRONES=1 makes the House station drones (#380) at start-up
      FORGE_STATION_DRONES: ${FORGE_STATION_DRONES:-0}
      DB_TEST_DATABASE: exmachinis_test
    volumes:
      - app-storage:/var/www/storage

  game-engine:
    build:
      context: ..
      dockerfile: deploy/engine/Dockerfile
    image: exmachinis-engine
    restart: unless-stopped
    init: true
    command: ["/opt/exmachinis/bin/run-engine.sh", "game-engine"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    environment: *engine-env
    volumes:
      - engine-logs:/opt/exmachinis/log

  events-engine:
    image: exmachinis-engine
    restart: unless-stopped
    init: true
    command: ["/opt/exmachinis/bin/run-engine.sh", "events-engine"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      game-engine: {condition: service_started}
    environment: *engine-env
    volumes:
      - engine-logs:/opt/exmachinis/log

  # The test world (#324 step 7): the same engines on the test database, with
  # a faster clock. Started with the testworld profile.
  test-game-engine:
    image: exmachinis-engine
    profiles: [testworld]
    restart: unless-stopped
    init: true
    command: ["/opt/exmachinis/bin/run-engine.sh", "game-engine"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      game-engine: {condition: service_started}
    environment:
      <<: *engine-env
      DB_NAME: exmachinis_test
      GAME_TIME_SCALE: ${TEST_GAME_TIME_SCALE:-600}
      GAME_TIME_FLOOR: "0"
    volumes:
      - test-engine-logs:/opt/exmachinis/log

  test-events-engine:
    image: exmachinis-engine
    profiles: [testworld]
    restart: unless-stopped
    init: true
    command: ["/opt/exmachinis/bin/run-engine.sh", "events-engine"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      test-game-engine: {condition: service_started}
    environment:
      <<: *engine-env
      DB_NAME: exmachinis_test
      GAME_TIME_SCALE: ${TEST_GAME_TIME_SCALE:-600}
      GAME_TIME_FLOOR: "0"
    volumes:
      - test-engine-logs:/opt/exmachinis/log

  scheduler:
    image: exmachinis-engine
    restart: unless-stopped
    init: true
    command: ["/opt/exmachinis/bin/scheduler.sh"]
    depends_on:
      app: {condition: service_started}
      game-engine: {condition: service_started}
    environment:
      CRON_KEY: ${CRON_KEY}
    volumes:
      - engine-logs:/opt/exmachinis/log

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-${DOMAIN}}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  app-storage:
  engine-logs:
  test-engine-logs:
  caddy-data:
  caddy-config:
