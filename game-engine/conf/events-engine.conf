#---------------------------
# TRACES configuration
# 0 essentials ... 3 debug (adds every orbit and date calculation behind
# distances and light-speed delays). Override with APP_TRACE_LEVEL=3.
#---------------------------
APP_TRACE_LEVEL = "2"

#---------------------------
# DATABASE configuration
#---------------------------
DB_HOST = "localhost"
DB_PORT = "3306"
DB_USER = "root"
# Any parameter here can be overridden by an environment variable of the
# same name. Keep the real DB_PASSWORD in scripts/.env rather than here.
DB_PASSWORD = "CHANGE_ME"
DB_NAME = "exmachinis"

#---------------------------
# LOGIC configuration
#---------------------------
# Engine periodicity (seconds)
ENGINE_CHECK_TIME = "5"
# Event expiration (days)
EVENT_EXPIRATION_DAYS = "30"
# actions expiration (days)
ACTION_EXPIRATION_DAYS = "30"
# Outcome events processed each round (events number)
OUTCOME_EVENT_BATCH_SIZE = "10"
