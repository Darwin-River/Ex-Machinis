#---------------------------
# TRACES configuration
# 0 essentials ... 3 debug (adds every orbit and date calculation behind
# distances and light-speed delays). Override with APP_TRACE_LEVEL=3.
#---------------------------
APP_TRACE_LEVEL = "2"

#---------------------------
# DATABASE configuration
#---------------------------
DB_HOST = "localhost"
DB_PORT = "3306"
DB_USER = "root"
# Any parameter here can be overridden by an environment variable of the
# same name. Keep the real DB_PASSWORD in scripts/.env rather than here.
DB_PASSWORD = "CHANGE_ME"
DB_NAME = "exmachinis"

#---------------------------
# LOGIC configuration
#---------------------------
# Engine periodicity (seconds)
ENGINE_CHECK_TIME = "1"
# Event expiration (days). Unused since #694: old events move to
# events_archive after house_rules.events_archive_days game days instead of
# being deleted
EVENT_EXPIRATION_DAYS = "30"
# Actions expiration (days). Unused since #944: the scheduler's keeper
# deletes finished actions after house_rules.actions_keep_days game days
ACTION_EXPIRATION_DAYS = "30"
# Outcome events processed each round (events number). 100 since #432: each
# round's query sorts every due event, so with 1,000 ships batches of 10 made
# it the events engine's biggest cost (8.6 ms a round). Each event still
# checks its action wasn't aborted just before it is processed.
OUTCOME_EVENT_BATCH_SIZE = "100"
