#------------------------------------------------
# GAME TIME configuration
#------------------------------------------------
# Master time scale: game seconds per real second. It governs everything that
# takes time in the game: orbits, action and travel durations, and the
# light-speed delay of emails. 60 means one real minute is one game hour.
# Changing it re-anchors the game clock, so nothing jumps. Since #380 (after
# round 40) the live world runs at the old test world's pace, 1800: a game
# day every 48 real seconds. There is no test world: every release is live,
# and players learn by releasing, watching and releasing again.
GAME_TIME_SCALE = "1800"
# The clock floor (#324 step 20): the clock aims for GAME_TIME_SCALE, and
# slows (by a quarter a minute) while the engines run more than
# CLOCK_LAG_HIGH real seconds behind, never below GAME_TIME_FLOOR; it speeds
# back up once they are less than CLOCK_LAG_LOW behind. Behind at the floor,
# the world is full: new releases wait in a queue. "0": the clock never floats.
GAME_TIME_FLOOR = "60"
CLOCK_LAG_HIGH = "10"
CLOCK_LAG_LOW = "3"
# Drones travel with constant acceleration (m/s^2, in game time), speeding up
# to the midpoint and slowing down after: time = 2 * sqrt(distance / a).
# 2 g since #380 round 38 (it was 1): a Mars trip took 10 of a round's 40
# days, and nobody who went there profited from it
TRAVEL_ACCELERATION = "19.6"

# Drone turns on several processes (#433): run ENGINE_SHARDS game engines,
# each with its own ENGINE_SHARD from 0 to ENGINE_SHARDS - 1. Each takes the
# drones whose ID leaves that remainder when divided by ENGINE_SHARDS, so a
# drone's turns always run in the same process. Shard 0 also does the shared
# work: stamping commands, the outbox, positions and the clock's pace.
# 1 (the default) runs one engine as before.
ENGINE_SHARDS = "1"
ENGINE_SHARD = "0"
