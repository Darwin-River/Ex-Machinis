#---------------------------
# TRACES configuration
# 0 essentials ... 3 debug (adds every orbit and date calculation behind
# distances and light-speed delays). Override with APP_TRACE_LEVEL=3.
#---------------------------
APP_TRACE_LEVEL = "2"

#---------------------------
# DATABASE configuration
#---------------------------
DB_HOST = "localhost"
DB_PORT = "3306"
DB_USER = "root"
# Any parameter here can be overridden by an environment variable of the
# same name. Keep the real DB_PASSWORD in scripts/.env rather than here.
DB_PASSWORD = "CHANGE_ME"
DB_NAME = "exmachinis"

#---------------------------
# LOGIC configuration
#---------------------------
DB_READ_TIME = "1"
# Instruction metering: a drone's script runs at most MAX_CYCLE_INSTRUCTIONS
# FORTH instructions per slice, then waits for its next turn. Each query and
# each action (perform) also costs a flat number of instructions.
MAX_CYCLE_INSTRUCTIONS = "100000"
# Loading a released script (#380 round 33): until it first runs launched, a
# drone may use up to LOAD_INSTRUCTIONS in all in one slice, so it reads its
# program at once instead of 100,000 at a time (about 80 slices, a game day
# or more at a fast clock). Past that it goes back to normal slices.
LOAD_INSTRUCTIONS = "20000000"
QUERY_INSTRUCTIONS = "1000"
ACTION_INSTRUCTIONS = "1000"
# Crash handling for launched drones: after a crash the drone restarts from
# the clean copy saved when it was first launched, CRASH_RESTART_WAIT game
# seconds later (doubling with each crash in a row), and is charged
# CRASH_RESTART_INSTRUCTIONS. CRASH_LIMIT crashes in a row make it a wreck.
CRASH_LIMIT = "5"
CRASH_RESTART_WAIT = "3600"
CRASH_RESTART_INSTRUCTIONS = "1000"
# "0" (the default since #367 step 5: there is no email) keeps drones'
# replies in the drone_messages table, which the website shows; "1" emails
# them, the original email game
EMAIL_ENABLED = "0"
# Power (#324 step 8): running a drone's computer burns 1 fuel per
# POWER_INSTRUCTIONS instructions ("0" makes computing free). 200,000 since
# #380 round 37 (it was 100,000): thinking costs half the fuel
POWER_INSTRUCTIONS = "200000"
# Reserved word/command to indicate (when inserted in Commands table) that we just need to resume VM execution, it is not a command to be executed
VM_RESUME_COMMAND = "@@@RESUME@@@"

