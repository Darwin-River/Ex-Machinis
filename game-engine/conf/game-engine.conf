#---------------------------
# TRACES configuration
#---------------------------
APP_TRACE_LEVEL = "3"

#---------------------------
# DATABASE configuration
#---------------------------
DB_HOST = "localhost"
DB_PORT = "3306"
DB_USER = "root"
# Any parameter here can be overridden by an environment variable of the
# same name. Keep the real DB_PASSWORD in scripts/.env rather than here.
DB_PASSWORD = "CHANGE_ME"
DB_NAME = "exmachinis"

#---------------------------
# LOGIC configuration
#---------------------------
DB_READ_TIME = "5"
# Max time a VM can run commands
MAX_CYCLE_SECONDS = "1"
# Reserved word/command to indicate (when inserted in Commands table) that we just need to resume VM execution, it is not a command to be executed
VM_RESUME_COMMAND = "@@@RESUME@@@"

#---------------------------
# EMAIL configuration
#---------------------------
# HTML emails
#SEND_EMAIL_SCRIPT = "/home/forth/game-engine/bin/scripts/email/email_html.sh"
#SEND_EMAIL_TEMPLATE = "<pre>---- Output ----\n\n%s\n\n<b>From:</b> %s\n<b>Sent:</b> %s\n<b>To:</b> %s\n<b>Subject:</b> %s\n\n%s\n\n</pre>"
# Plain text emails
SEND_EMAIL_SCRIPT = "/home/forth/game-engine/bin/scripts/email/email.sh"
#SEND_EMAIL_TEMPLATE = "---- Output ----\n\n%s\n\nFrom: %s\nSent: %s\nTo: %s\nSubject: %s\n\n%s\n\n"
SEND_EMAIL_TEMPLATE = "\n%s\n\nContact help@exmachinis.com if you need assistance.\n\nFrom: %s\nSent: %s\nTo: %s\nSubject: %s\n\n%s\n\n"
AGENTS_EMAIL_DOMAIN = "exmachinis.com"

#---------------------------
# FORTH configuration
#---------------------------
FORTH_IMAGE_PATH="/home/forth/game-engine/bin/eforth.blk"

#------------------------------------------------
# When enabled the FORTH_DUMP_VM
# we can dump agent's vm into disk for further study
#------------------------------------------------
FORTH_DUMP_VM = "1"
FORTH_VM_OUT_PATH="/home/forth/game-engine/tmp"

#------------------------------------------------
# GAME TIME configuration
#------------------------------------------------
# Master time scale: game seconds per real second. It governs everything that
# takes time in the game: orbits, action and travel durations, and the
# light-speed delay of emails. 60 means one real minute is one game hour.
# Changing it re-anchors the game clock, so nothing jumps.
GAME_TIME_SCALE = "60"
# Drones travel with constant acceleration (m/s^2, in game time), speeding up
# to the midpoint and slowing down after: time = 2 * sqrt(distance / a)
TRAVEL_ACCELERATION = "1"
